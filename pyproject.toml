[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yashiftoptimizer"
version = "0.1.0"
description = "Weekly shift scheduling and repair with a natural-language MCP interface"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "ortools>=9.10",
    "pydantic>=2.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shiftopt = "shiftopt.cli:main"

[tool.setuptools.packages.find]
include = ["shiftopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
